<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multiplay Entretenimento</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0E14;color:#fff;font-family:'Montserrat',sans-serif}
header{display:flex;justify-content:space-between;padding:15px 30px;align-items:center;border-bottom:1px solid #1e2432;background:#10141f;flex-wrap:wrap;gap:10px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px}
.logo-icon{width:36px;height:36px;background:linear-gradient(135deg,#0A84FF,#8B5CF6);border-radius:9px;display:flex;align-items:center;justify-content:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:15px;margin-top:25px}
.card{background:#151a25;padding:10px;border-radius:12px;border:1px solid #1e2432;cursor:pointer}
.card img{width:100%;height:95px;object-fit:contain;background:#000;border-radius:8px}
</style>
</head>
<body>
<header>
<div class="logo"><span class="logo-icon">▶</span><span>Multiplay <span style="color:#8B5CF6">Entretenimento</span></span></div>
<div style="display:flex;gap:15px;align-items:center">
<span id="info-user" style="color:#8892a6;font-size:13px"></span>
<button onclick="sair()" style="background:#1e2432;color:#fff;border:none;padding:8px 14px;border-radius:6px;cursor:pointer">Sair</button>
</div>
</header>

<div style="padding:30px;max-width:1400px;margin:0 auto">
<h1 id="bemvindo">Carregando...</h1>
<p id="status" style="color:#8892a6">Conectado ao servidor u.l0.ms</p>
<div id="canais" class="grid"></div>
</div>

<script>
// NAO redireciona automatico - mostra o erro na tela
const user = localStorage.getItem('mp_user');
const pass = localStorage.getItem('mp_pass');

document.getElementById('info-user').innerText = user ? 'Logado: ' + user : '';

if(!user || !pass){
  document.getElementById('bemvindo').innerText = 'Você não está logado';
  document.getElementById('canais').innerHTML = '<a href="login.html" style="color:#0A84FF">Ir para login</a>';
} else {
  document.getElementById('bemvindo').innerText = `Olá, ${user}! 1704 canais encontrados`;
  carregarCanais();
}

async function carregarCanais(){
  const container = document.getElementById('canais');
  const status = document.getElementById('status');
  container.innerHTML = '<p style="color:#8892a6;padding:20px">📡 Carregando seus 1704 canais...</p>';
  try{
    const res = await fetch(`/api/canais?user=${encodeURIComponent(user)}&pass=${encodeURIComponent(pass)}`);
    const canais = await res.json();
    status.innerText = `${canais.length} canais ao vivo`;
    container.innerHTML = canais.map(c => `
      <div class="card" onclick="abrirCanal('${c.stream_id}','${c.name.replace(/'/g,"")}')">
        <img src="${c.stream_icon || ''}" loading="lazy" onerror="this.src='https://via.placeholder.com/160x90/0B0E14/8892a6?text=TV'">
        <p style="font-size:12px;margin:8px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600">${c.name}</p>
        <span style="font-size:10px;color:#0A84FF;font-weight:800">● AO VIVO</span>
      </div>
    `).join('');
  }catch(e){
    document.getElementById('bemvindo').innerText = 'Erro ao carregar canais';
    container.innerHTML = `<p style="color:#ff5a5a">Erro: ${e.message}<br><button onclick="localStorage.clear();location.href='login.html'" style="margin-top:10px;padding:10px 20px;background:#1e2432;color:#fff;border:none;border-radius:6px">Voltar ao login</button></p>`;
  }
}
