<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MultiPlay • Série</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#071018;color:#f5f8fb;font-family:Arial,sans-serif}
.wrap{max-width:1000px;margin:auto;padding:20px}.back{color:#9cc4ff;text-decoration:none}.hero{margin:20px 0;padding:20px;border:1px solid #203442;border-radius:18px;background:#102637}
h1{margin:0 0 8px}.muted{color:#9fb0bf}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.card{background:#0d1822;border:1px solid #203442;border-radius:14px;padding:16px}.card h3{margin:0 0 8px}.btn{display:block;text-align:center;text-decoration:none;border:0;border-radius:9px;background:#168cff;color:#fff;padding:10px;width:100%;cursor:pointer}
.status{padding:20px 0;color:#9fb0bf}.error{color:#ff9b9b}
</style>
</head>
<body>
<main class="wrap">
<a class="back" href="/app.html">← Voltar para o MultiPlay</a>
<section class="hero"><h1 id="title">Carregando série...</h1><div id="meta" class="muted"></div></section>
<div id="status" class="status">Carregando episódios...</div>
<section id="episodes" class="grid"></section>
</main>
<script>
const user=sessionStorage.getItem('mp_user')||'';
const id=new URLSearchParams(location.search).get('series_id');
const title=document.getElementById('title'),meta=document.getElementById('meta'),status=document.getElementById('status'),episodes=document.getElementById('episodes');
if(!user) location.href='/login.html';
function esc(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function play(ep){
 sessionStorage.setItem('mp_stream_id',String(ep.id||ep.stream_id||''));
 sessionStorage.setItem('mp_stream_name',ep.title||ep.name||'Episódio');
 sessionStorage.setItem('mp_stream_type','serie');
 sessionStorage.setItem('mp_stream_image',ep.info?.movie_image||ep.stream_icon||'');
 sessionStorage.setItem('mp_stream_extension',ep.container_extension||'');
 location.href='/player.html';
}
async function load(){
 if(!id){status.textContent='Série não informada.';status.className='status error';return;}
 try{
  const r=await fetch('/api/serie?username='+encodeURIComponent(user)+'&series_id='+encodeURIComponent(id),{cache:'no-store'});
  const d=await r.json();
  if(!r.ok) throw new Error(d.error||'Não foi possível carregar a série.');
  title.textContent=d.info?.name||d.name||'Série';
  meta.textContent=d.info?.plot||'Selecione um episódio para assistir.';
  const seasons=d.episodes||{};
  const list=Object.keys(seasons).flatMap(s=>(Array.isArray(seasons[s])?seasons[s]:[]).map(ep=>({...ep,_season:s})));
  status.textContent=list.length?list.length+' episódio(s) disponível(is).':'Nenhum episódio encontrado.';
  episodes.innerHTML=list.map(ep=>'<article class="card"><h3>'+esc(ep.title||ep.name||'Episódio')+'</h3><div class="muted">Temporada '+esc(ep._season)+' • Episódio '+esc(ep.episode_num||'')+'</div><br><button class="btn" onclick="play('+JSON.stringify(ep).replace(/"/g,'&quot;')+')">▶ Assistir</button></article>').join('');
 }catch(e){console.error(e);status.textContent=e.message;status.className='status error';}
}
load();
</script>
</body>
</html>
