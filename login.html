<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MultiPlay - Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at center, #202020 0%, #080808 65%);
      color: #fff;
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      padding: 35px 25px;
      background: #111;
      border: 1px solid #292929;
      border-radius: 16px;
      box-shadow: 0 15px 50px rgba(0,0,0,.5);
    }

    .logo {
      text-align: center;
      font-size: 34px;
      font-weight: 900;
      margin-bottom: 8px;
    }

    .logo span {
      color: #e50914;
    }

    .subtitle {
      text-align: center;
      color: #888;
      margin-bottom: 30px;
      font-size: 14px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #ccc;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 18px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #1b1b1b;
      color: #fff;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #e50914;
    }

    button {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 8px;
      background: #e50914;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    #message {
      min-height: 20px;
      margin-top: 18px;
      text-align: center;
      color: #ff7777;
      font-size: 14px;
    }

    .back {
      display: block;
      margin-top: 20px;
      text-align: center;
      color: #777;
      text-decoration: none;
      font-size: 13px;
    }

    .back:hover {
      color: #fff;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">
      MULTI<span>PLAY</span>
    </div>

    <div class="subtitle">
      Acesse seu aplicativo
    </div>

    <form id="loginForm">

      <label for="username">
        Usuário
      </label>

      <input
        id="username"
        type="text"
        placeholder="Digite seu usuário"
        autocomplete="username"
        required
      >

      <label for="password">
        Senha
      </label>

      <input
        id="password"
        type="password"
        placeholder="Digite sua senha"
        autocomplete="current-password"
        required
      >

      <button id="loginButton" type="submit">
        ENTRAR
      </button>

      <div id="message"></div>

    </form>

    <a href="/" class="back">
      ← Voltar para o site
    </a>

  </div>


  <script>

    const form = document.getElementById("loginForm");
    const button = document.getElementById("loginButton");
    const message = document.getElementById("message");


    form.addEventListener("submit", async function(event) {

      event.preventDefault();

      const username =
        document.getElementById("username").value.trim();

      const password =
        document.getElementById("password").value;

      if (!username || !password) {
        message.textContent =
          "Informe usuário e senha.";

        return;
      }


      button.disabled = true;
      button.textContent = "ENTRANDO...";
      message.textContent = "";


      try {

        /*
         * O servidor valida as credenciais.
         * Nenhuma senha fica gravada neste arquivo.
         */

        const response = await fetch("/api/login", {

          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            username: username,
            password: password
          })

        });


        const data = await response.json();


        if (!response.ok || !data.success) {

          throw new Error(
            data.message ||
            "Usuário ou senha inválidos."
          );

        }


        sessionStorage.setItem(
          "mp_user",
          username
        );

        sessionStorage.setItem(
          "mp_pass",
          password
        );


        window.location.href = "/app.html";

      }

      catch (error) {

        console.error(error);

        message.textContent =
          error.message ||
          "Não foi possível entrar.";

        button.disabled = false;
        button.textContent = "ENTRAR";

      }

    });

  </script>

</body>
</html>
