<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Multiplay — Painel</title><style>body{margin:0;background:#050810;color:#fff;font-family:Arial;padding:20px}.wrap{max-width:1100px;margin:auto}.card{background:#0d1522;border:1px solid #203047;border-radius:16px;padding:20px;margin:15px 0}input{width:100%;box-sizing:border-box;padding:12px;margin:6px 0;background:#08101b;border:1px solid #29405c;border-radius:8px;color:#fff}button{padding:12px 18px;border:0;border-radius:8px;background:#168cff;color:#fff;font-weight:800;margin-top:8px}.muted{color:#9eacbd;font-size:13px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.device{padding:14px;border-top:1px solid #24364b}.ok{color:#5cffb0}.bad{color:#ff8b8b}@media(max-width:700px){.row{grid-template-columns:1fr}}</style></head><body><div class="wrap"><h1>⚙️ Multiplay — Dispositivos</h1><p class="muted">Associe somente playlists que você possui, licencia ou está autorizado a distribuir.</p><div class="card"><h2>Adicionar / atualizar</h2><div class="row"><input id="id" placeholder="Device ID"><input id="key" placeholder="Device Key"><input id="user" placeholder="Cliente / usuário"><input id="name" placeholder="Nome da playlist"><input id="url" placeholder="URL M3U autorizada"><input id="epg" placeholder="URL EPG (opcional)"><input id="exp" type="date"><label style="padding:12px"><input id="active" type="checkbox" checked style="width:auto"> Ativo</label></div><button onclick="save()">SALVAR</button><span id="msg" class="muted"></span></div><div class="card"><h2>Dispositivos cadastrados</h2><div id="list">Carregando...</div></div></div><script>async function load(){let r=await fetch('/api/admin/devices');if(r.status===401){location='/login.html';return}let d=await r.json();list.innerHTML=d.devices.map(x=>'<div class="device"><b>'+x.device_id+'</b><br>Key: '+x.device_key+'<br>Cliente: '+(x.customer_username||'—')+'<br>Playlist: '+(x.playlist_name||'—')+'<br>Status: <span class="'+(x.active?'ok':'bad')+'">'+(x.active?'ATIVO':'INATIVO')+'</span><br><small class="muted">'+(x.playlist_url||'Sem playlist')+'</small></div>').join('')||'Nenhum dispositivo.'}async function save(){let body={device_id:id.value.trim(),device_key:key.value.trim(),customer_username:user.value.trim(),playlist_name:name.value.trim(),playlist_url:url.value.trim(),epg_url:epg.value.trim(),expires_at:exp.value||null,active:active.checked};let r=await fetch('/api/admin/devices',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});let d=await r.json();msg.textContent=d.message||'Concluído';if(d.success)load()}load();</script></body></html>
