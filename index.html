<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Multiplay Entretenimento</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0B0E14;
      color: #fff;
      font-family: 'Montserrat', Arial, sans-serif;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      padding: 15px 25px;
      background: #10141F;
      border-bottom: 1px solid #202638;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 20px;
    }

    .logo-icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #0A84FF, #8B5CF6);
    }

    .user-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .user-info {
      color: #8D97AA;
      font-size: 13px;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 10px 15px;
      background: #202638;
      color: #fff;
      cursor: pointer;
      font-weight: 600;
    }

    button:hover {
      background: #2B344A;
    }

    main {
      max-width: 1400px;
      margin: auto;
      padding: 25px;
    }

    h1 {
      margin-bottom: 5px;
    }

    .status {
      color: #8D97AA;
      margin-top: 0;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 14px;
      margin-top: 25px;
    }

    .card {
      background: #151A25;
      border: 1px solid #222A3C;
      border-radius: 12px;
      padding: 10px;
      cursor: pointer;
      transition: 0.2s;
      min-width: 0;
    }

    .card:hover {
      border-color: #0A84FF;
      transform: translateY(-2px);
    }

    .card img {
      width: 100%;
      height: 100px;
      object-fit: contain;
      background: #05070B;
      border-radius: 8px;
    }

    .channel-name {
      font-size: 12px;
      margin: 8px 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 600;
    }

    .live {
      font-size: 10px;
      color: #0A84FF;
      font-weight: 800;
    }

    .notice {
      padding: 20px;
      border: 1px solid #222A3C;
      background: #111620;
      border-radius: 12px;
    }

    .error {
      color: #FF7070;
    }

    @media (max-width: 600px) {
      header {
        padding: 12px 15px;
      }

      .logo {
        font-size: 16px;
      }

      .logo-icon {
        width: 34px;
        height: 34px;
      }

      main {
        padding: 18px;
      }

      .user-info {
        display: none;
      }

      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .card img {
        height: 85px;
      }
    }
  </style>
</head>

<body>

<header>

  <div class="logo">
    <span class="logo-icon">▶</span>

    <span>
      Multiplay
      <span style="color:#8B5CF6;">
        Entretenimento
      </span>
    </span>
  </div>

  <div class="user-area">

    <span id="user-info" class="user-info"></span>

    <button onclick="sair()">
      Sair
    </button>

  </div>

</header>


<main>

  <h1 id="titulo">
    Carregando...
  </h1>

  <p id="status" class="status">
    Preparando sua programação...
  </p>

  <div id="canais" class="grid"></div>

</main>


<script>

const user = sessionStorage.getItem("mp_user");
const pass = sessionStorage.getItem("mp_pass");

const canaisContainer = document.getElementById("canais");
const titulo = document.getElementById("titulo");
const status = document.getElementById("status");
const userInfo = document.getElementById("user-info");


/*
==================================================
VERIFICA LOGIN
==================================================
*/

if (!user || !pass) {

  titulo.textContent = "Você não está logado";

  status.textContent = "";

  canaisContainer.innerHTML = `
    <div class="notice">
      <p>Faça login para acessar sua programação.</p>

      <a
        href="login.html"
        style="color:#0A84FF;font-weight:600;"
      >
        Ir para o login
      </a>
    </div>
  `;

} else {

  userInfo.textContent = "Logado: " + user;

  carregarCanais();

}


/*
==================================================
CARREGAR CANAIS
==================================================
*/

async function carregarCanais() {

  canaisContainer.innerHTML = `
    <div class="notice">
      📡 Carregando seus canais...
    </div>
  `;

  try {

    const url =
      "/api/canais?user=" +
      encodeURIComponent(user) +
      "&pass=" +
      encodeURIComponent(pass);


    const resposta = await fetch(url, {
      method: "GET",
      cache: "no-store"
    });


    let dados;

    try {

      dados = await resposta.json();

    } catch {

      throw new Error(
        "O servidor não retornou uma resposta válida."
      );

    }


    if (!resposta.ok) {

      throw new Error(
        dados.error || "Não foi possível carregar os canais."
      );

    }


    if (!Array.isArray(dados)) {

      throw new Error(
        "O servidor retornou os canais em formato inválido."
      );

    }


    if (dados.length === 0) {

      titulo.textContent = "Nenhum canal disponível";

      status.textContent =
        "Não foram encontrados canais para este acesso.";

      canaisContainer.innerHTML = "";

      return;

    }


    titulo.textContent =
      "Olá, " + user + "!";


    status.textContent =
      dados.length + " canais ao vivo";


    canaisContainer.innerHTML = "";


    dados.forEach(canal => {

      const card = document.createElement("div");

      card.className = "card";


      const imagem = document.createElement("img");

      imagem.loading = "lazy";

      imagem.src =
        canal.stream_icon || "";

      imagem.alt =
        canal.name || "Canal";


      imagem.onerror = function () {

        this.src =
          "https://via.placeholder.com/170x100/0B0E14/8D97AA?text=TV";

      };


      const nome = document.createElement("div");

      nome.className = "channel-name";

      nome.textContent =
        canal.name || "Canal";


      const live = document.createElement("div");

      live.className = "live";

      live.textContent =
        "● AO VIVO";


      card.appendChild(imagem);

      card.appendChild(nome);

      card.appendChild(live);


      card.addEventListener("click", () => {

        abrirCanal(
          canal.stream_id,
          canal.name || "Multiplay Player"
        );

      });


      canaisContainer.appendChild(card);

    });


  } catch (erro) {

    console.error(erro);


    titulo.textContent =
      "Erro ao carregar canais";


    status.textContent = "";


    canaisContainer.innerHTML = `
      <div class="notice error">

        ${escapeHtml(erro.message)}

        <br><br>

        <button onclick="sair()">
          Voltar ao login
        </button>

      </div>
    `;

  }

}


/*
==================================================
ABRIR PLAYER
==================================================
*/

function abrirCanal(id, nome) {

  if (!id) {

    alert("Este canal não possui um identificador válido.");

    return;

  }


  /*
  Não colocamos o vídeo diretamente no index.
  O player.html será responsável pelo HLS.
  */

  sessionStorage.setItem(
    "mp_stream_id",
    String(id)
  );


  sessionStorage.setItem(
    "mp_stream_name",
    String(nome)
  );


  window.location.href =
    "player.html";

}


/*
==================================================
SAIR
==================================================
*/

function sair() {

  sessionStorage.removeItem("mp_user");

  sessionStorage.removeItem("mp_pass");

  sessionStorage.removeItem("mp_server");

  sessionStorage.removeItem("mp_stream_id");

  sessionStorage.removeItem("mp_stream_name");

  window.location.href =
    "login.html";

}


/*
==================================================
SEGURANÇA BÁSICA DE TEXTO
==================================================
*/

function escapeHtml(text) {

  return String(text)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}

</script>

</body>
</html>
