<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MultiPlay Entretenimento</title>

  <meta
    name="description"
    content="MultiPlay Entretenimento: TV, filmes, séries, livros, e-books e audiobooks."
  >

  <link rel="manifest" href="/manifest.json">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #050505;
      color: #fff;
      line-height: 1.5;
    }

    a {
      color: inherit;
    }

    /* TOPO */

    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(5, 5, 5, 0.96);
      border-bottom: 1px solid #252525;
      backdrop-filter: blur(12px);
    }

    .topbar {
      max-width: 1200px;
      margin: auto;
      padding: 15px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      font-size: 27px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .logo span {
      color: #e50914;
    }

    .top-button {
      background: #e50914;
      color: #fff;
      padding: 10px 17px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      font-size: 14px;
    }

    /* HERO */

    .hero {
      min-height: 650px;
      display: flex;
      align-items: center;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 75% 30%, rgba(229,9,20,.35), transparent 30%),
        radial-gradient(circle at 20% 70%, rgba(100,0,0,.3), transparent 35%),
        linear-gradient(135deg, #080808, #180303 50%, #050505);
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(
          90deg,
          rgba(0,0,0,.95),
          rgba(0,0,0,.55),
          rgba(0,0,0,.15)
        );
    }

    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 1200px;
      width: 100%;
      margin: auto;
      padding: 70px 20px;
    }
