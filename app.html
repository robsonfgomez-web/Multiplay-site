<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#080808"
  >

  <title>MultiPlay</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #080808;
      color: #fff;
      font-family: Arial, sans-serif;
      min-height: 100vh;
    }

    button {
      font-family: inherit;
    }

    /* ================================
       TOPO
    ================================= */

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(8,8,8,.96);
      border-bottom: 1px solid #222;
      padding: 18px 22px;
      backdrop-filter: blur(12px);
    }

    .topbar {
      max-width: 1400px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -1px;
    }

    .logo span {
      color: #e50914;
    }

    .user-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .user-name {
      color: #aaa;
      font-size: 14px;
    }

    .logout {
      background: #222;
      color: #fff;
      border: 1px solid #333;
      padding: 9px 14px;
      border-radius: 7px;
      cursor: pointer;
    }

    .logout:hover {
      background: #333;
    }

    /* ================================
       CONTEÚDO
    ================================= */

    main {
      max-width: 1400px;
      margin: auto;
      padding: 25px 20px 60px;
    }

    .welcome {
      margin-bottom: 25px;
    }

    .welcome h1 {
      font-size: 30px;
      margin-bottom: 6px;
    }

    .welcome p {
      color: #888;
    }

    /* ================================
       BUSCA
    ================================= */

    .search-box {
      margin-bottom: 25px;
    }

    .search-box input {
      width: 100%;
      padding: 15px 18px;
      background: #151515;
      border: 1px solid #292929;
      border-radius: 9px;
      color: #fff;
      font-size: 16px;
      outline: none;
    }

    .search-box input:focus {
      border-color: #e50914;
    }

    /* ================================
       NAVEGAÇÃO
    ================================= */

    .tabs {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 30px;
    }

    .tabs button {
      flex-shrink: 0;
      padding: 12px 18px;
      border-radius: 8px;
      border: 1px solid #292929;
      background: #151515;
      color: #bbb;
      cursor: pointer;
      font-weight: bold;
    }

    .tabs button.active,
    .tabs button:hover {
      background: #e50914;
      border-color: #e50914;
      color: #fff;
    }

    /* ================================
       SEÇÕES
    ================================= */

    .section {
      margin-bottom: 38px;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .section-title h2 {
      font-size: 21px;
    }

    .section-title span {
      color: #777;
      font-size: 13px;
    }

    /* ================================
       CONTINUAR
    ================================= */

    .continue-card {
      display: flex;
      align-items: center;
      gap: 18px;
      background: linear-gradient(
        100deg,
        #191919,
        #101010
      );
      border: 1px solid #292929;
      border-radius: 12px;
      padding: 15px;
      cursor: pointer;
      transition: .2s;
      margin-bottom: 12px;
    }

    .continue-card:hover {
      border-color: #e50914;
      transform: translateY(-2px);
    }

    .continue-thumb {
      width: 120px;
      height: 70px;
      background: #252525;
      border-radius: 7px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .continue-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .continue-info {
      flex: 1;
      min-width: 0;
    }

    .continue-info h3 {
      font-size: 16px;
      margin-bottom: 7px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .continue-info p {
      color: #888;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .progress {
      width: 100%;
      height: 5px;
      background: #333;
      border-radius: 5px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: #e50914;
    }

    .continue-button {
      background: #e50914;
      color: #fff;
      border: 0;
      padding: 10px 15px;
      border-radius: 7px;
      font-weight: bold;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* ================================
       CARDS
    ================================= */

    .grid {
      display: grid;
      grid-template-columns:
        repeat(auto-fill, minmax(150px, 1fr));
      gap: 15px;
    }

    .card {
      background: #151515;
      border: 1px solid #252525;
      border-radius: 9px;
      overflow: hidden;
      cursor: pointer;
      transition: .2s;
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: #e50914;
    }

    .poster {
      width: 100%;
      aspect-ratio: 2 / 3;
      background: #222;
      overflow: hidden;
    }

    .poster img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-info {
      padding: 11px;
    }

    .card-info h3 {
      font-size: 14px;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-info p {
      color: #777;
      font-size: 11px;
      margin-top: 5px;
    }

    /* ================================
       CATEGORIAS
    ================================= */

    .category-list {
      display: flex;
      gap: 9px;
      overflow-x: auto;
      margin-bottom: 20px;
      padding-bottom: 5px;
    }

    .category-list button {
      flex-shrink: 0;
      background: #181818;
      color: #aaa;
      border: 1px solid #292929;
      padding: 10px 15px;
      border-radius: 7px;
      cursor: pointer;
    }

    .category-list button.active {
      background: #e50914;
      border-color: #e50914;
      color: #fff;
    }

    /* ================================
       ESTADOS
    ================================= */

    .loading,
    .empty,
    .error {
      text-align: center;
      padding: 40px 20px;
      color: #777;
    }

    .error {
      color: #ff7777;
    }

    .hidden {
      display: none !important;
    }

    /* ================================
       RESPONSIVO
    ================================= */

    @media (max-width: 600px) {

      header {
        padding: 15px;
      }

      main {
        padding: 20px 14px 50px;
      }

      .logo {
        font-size: 24px;
      }

      .user-name {
        display: none;
      }

      .welcome h1 {
        font-size: 24px;
      }

      .grid {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }

      .continue-card {
        gap: 12px;
      }

      .continue-thumb {
        width: 95px;
        height: 60px;
      }

      .continue-button {
        display: none;
      }

    }

    /* TV / telas grandes */

    @media (min-width: 1200px) {

      .grid {
        grid-template-columns:
          repeat(7, minmax(0, 1fr));
      }

      .tabs button,
      .category-list button,
      .continue-card,
      .card {
        outline-offset: 3px;
      }

      button:focus,
      .card:focus {
        outline: 2px solid #e50914;
      }

    }

  </style>

</head>


<body>


<header>

  <div class="topbar">

    <div class="logo">
      MULTI<span>PLAY</span>
    </div>

    <div class="user-area">

      <div
        id="userName"
        class="user-name"
      >
        Cliente
      </div>

      <button
        class="logout"
        onclick="logout()"
      >
        Sair
      </button>

    </div>

  </div>

</header>


<main>


  <div class="welcome">

    <h1>
      Olá, <span id="welcomeName">Cliente</span> 👋
    </h1>

    <p>
      Escolha o que deseja assistir, ler ou ouvir.
    </p>

  </div>


  <!-- BUSCA -->

  <div class="search-box">

    <input
      id="searchInput"
      type="search"
      placeholder="🔎 Buscar filmes, séries, canais, livros..."
      autocomplete="off"
    >

  </div>


  <!-- ABAS -->

  <div class="tabs">

    <button
      class="active"
      data-section="home"
    >
      🏠 Início
    </button>

    <button data-section="canais">
      📺 Canais
    </button>

    <button data-section="filmes">
      🎬 Filmes
    </button>

    <button data-section="series">
      📺 Séries
    </button>

    <button data-section="livros">
      📖 Livros
    </button>

    <button data-section="ebooks">
      📚 E-books
    </button>

    <button data-section="audiobooks">
      🎧 Audiobooks
    </button>

  </div>


  <!-- ==============================
       INÍCIO
  ================================= -->

  <div id="homeSection">


    <!-- CONTINUAR -->

    <section
      id="continueSection"
      class="section hidden"
    >

      <div class="section-title">

        <h2>
          ▶️ Continuar de onde parou
        </h2>

        <span>
          Seus conteúdos
        </span>

      </div>

      <div id="continueList"></div>

    </section>


    <!-- VISTOS RECENTES -->

    <section
      id="recentSection"
      class="section hidden"
    >

      <div class="section-title">

        <h2>
          🕘 Vistos recentemente
        </h2>

        <span>
          Histórico
        </span>

      </div>

      <div
        id="recentGrid"
        class="grid"
      ></div>

    </
