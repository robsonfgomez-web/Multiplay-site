<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MultiPlay Entretenimento</title>
<style>
:root{--bg:#071018;--panel:#0d1822;--text:#f5f8fb;--muted:#9fb0bf;--blue:#168cff;--line:#203442}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#061018,#0a121a 45%,#071018);color:var(--text);font-family:Arial,Helvetica,sans-serif}
.header{position:sticky;top:0;z-index:10;background:rgba(5,12,18,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top{max-width:1250px;margin:auto;padding:14px 18px;display:flex;align-items:center;gap:14px}.brand{font-weight:900;font-size:21px}.brand span{color:var(--blue)}.user{margin-left:auto;color:var(--muted);font-size:13px}.logout{border:1px solid var(--line);background:#101e29;color:#fff;border-radius:9px;padding:8px 12px}
.search{max-width:1250px;margin:auto;padding:0 18px 14px}.search input{width:100%;background:#0e1b25;border:1px solid var(--line);color:#fff;border-radius:12px;padding:12px 14px;outline:none}
.tabs{max-width:1250px;margin:auto;padding:0 18px 12px;display:flex;gap:8px;overflow:auto}.tab{white-space:nowrap;border:1px solid var(--line);background:#0c1720;color:#b9c8d4;border-radius:999px;padding:9px 14px}.tab.active{background:var(--blue);border-color:var(--blue);color:#fff}
main{max-width:1250px;margin:auto;padding:22px 18px 50px}.hero{padding:24px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(135deg,#102637,#0c1720);margin-bottom:24px}.hero h1{margin:0 0 8px;font-size:30px}.hero p{margin:0;color:var(--muted)}.notice{margin-top:14px;color:#ffd6b5;font-size:13px}
.section{margin:28px 0}.section h2{margin:0 0 14px;font-size:20px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:13px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;overflow:hidden;min-height:205px;display:flex;flex-direction:column}.poster{height:145px;background:linear-gradient(145deg,#14304a,#111c26);display:flex;align-items:center;justify-content:center;font-size:43px}.poster.channel{height:120px}.poster.book{height:125px}.cardbody{padding:11px}.title{font-weight:800;line-height:1.25}.meta{font-size:12px;color:var(--muted);margin-top:5px}.card button{margin:10px;border:0;border-radius:9px;background:#172a38;color:#fff;padding:8px}.empty{color:var(--muted);padding:25px;border:1px dashed var(--line);border-radius:14px}
@media(max-width:600px){.top{padding:12px}.user{display:none}.hero h1{font-size:24px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.poster{height:125px}}
</style></head>
<body>
<header class="header">
<div class="top">
<div class="brand">MultiPlay <span>Entretenimento</span></div>
<div class="user" id="userLabel"></div>
<button class="logout" onclick="sair()">Sair</button>
</div>

<div class="search">
<input id="search" placeholder="Buscar no catálogo..." oninput="render()">
</div>

<nav class="tabs" id="tabs"></nav>
</header>

<main>

<section class="hero">
<h1>Seu entretenimento em um só lugar</h1>
<p>TV, filmes, séries e uma biblioteca digital completa.</p>
<div class="notice">
Catálogo de demonstração: canais, filmes e séries estão organizados para apresentação. O streaming será conectado depois, individualmente para cada cliente.
</div>
</section>

<div id="content"></div>

</main>

<script>

const user=
localStorage.getItem('mp_user')||
sessionStorage.getItem('mp_user')||
'';

const catalog={

canais:[
['Globo','TV Aberta','📺'],
['SBT','TV Aberta','📺'],
['Record','TV Aberta','📺'],
['Band','TV Aberta','📺'],
['CNN Brasil','Notícias','📰'],
['GloboNews','Notícias','📰'],
['SporTV','Esportes','⚽'],
['Canal Brasil','Cinema','🎬'],
['TV Cultura','Cultura','📚'],
['GNT','Entretenimento','✨'],
['RedeTV!','TV Aberta','📡'],
['BandNews','Notícias','📰']
],

filmes:[
['A Minecraft Movie','Aventura','🎬'],
['Riot','Ação','🍿'],
['UNABOMBER','Crime','🎞️'],
['Black Adam','Ação','🎬'],
['Daredevil','Ação','🍿'],
['Shrek','Animação','🎬'],
['Shrek 2','Animação','🎬'],
['War Machine','Ação','🎞️'],
['Blood Work','Suspense','🎬'],
['Kissing Is the Easy Part','Comédia','🍿'],
['Best of the Best','Ação','🎞️'],
['How to Lose a Popularity Contest','Comédia','🎬']
],

series:[
['Monstro: A História de Lizzie Borden','Drama','📺'],
['Wonka: O Bilhete Dourado','Família','⭐'],
['A Garota do Remo','Drama','🎭'],
['Um Mundo Diferente','Drama','⭐'],
['Magnatas do Crime','Crime','🎬'],
['A Casa Mágica da Gabby','Infantil','🌈'],
['RAW: 2026','Esportes','🏆'],
['The Great British Baking Show','Reality','🍰'],
['Danny Go!','Infantil','🧸'],
['Habeas Corpus','Drama','🎭']
],

livros:[
['Dom Casmurro','Machado de Assis','📚'],
['O Alienista','Machado de Assis','📖'],
['Memórias Póstumas de Brás Cubas','Machado de Assis','📚'],
['A Arte da Guerra','Sun Tzu','📖'],
['O Príncipe','Nicolau Maquiavel','📚'],
['A República','Platão','📖'],
['Frankenstein','Mary Shelley','📚'],
['Alice no País das Maravilhas','Lewis Carroll','📖']
],

ebooks:[
['The Adventures of Sherlock Holmes','Project Gutenberg','📱'],
['Alice’s Adventures in Wonderland','Project Gutenberg','📖'],
['Frankenstein','Project Gutenberg','💻'],
['Pride and Prejudice','Project Gutenberg','📱'],
['The Time Machine','Project Gutenberg','📖'],
['The Art of War','Project Gutenberg','💻'],
['Meditations','Project Gutenberg','📱'],
['A Christmas Carol','Project Gutenberg','📖']
],

audiobooks:[
['Alice’s Adventures in Wonderland','LibriVox','🎧'],
['The Adventures of Sherlock Holmes','LibriVox','🔊'],
['Frankenstein','LibriVox','🎧'],
['The Time Machine','LibriVox','🎙️'],
['Pride and Prejudice','LibriVox','🎧'],
['A Christmas Carol','LibriVox','🔊']
]

};

const labels={
inicio:'Início',
canais:'Canais',
filmes:'Filmes',
series:'Séries',
livros:'Livros',
ebooks:'E-books',
audiobooks:'Audiobooks'
};

let tab='inicio';

document.getElementById('userLabel').textContent=
user?'Cliente: '+user:'MultiPlay';

function setupTabs(){

tabs.innerHTML=
Object.entries(labels)
.map(([k,v])=>
'<button class="tab '+(tab===k?'active':'')+
'" onclick="tab=\''+k+'\';setupTabs();render()">'+
v+'</button>'
).join('');

}

function card(x,type){

return '<article class="card">'+

'<div class="poster '+
(type==='canais'?'channel ':'')+
(type==='livros'||type==='ebooks'||type==='audiobooks'?'book':'')+
'">'+x[2]+'</div>'+

'<div class="cardbody">'+
'<div class="title">'+esc(x[0])+'</div>'+
'<div class="meta">'+esc(x[1])+'</div>'+
'</div>'+

'<button onclick="demo()">Abrir</button>'+

'</article>';

}

function section(title,type){

const q=
search.value.toLowerCase().trim();

const arr=
catalog[type].filter(x=>
!q||x[0].toLowerCase().includes(q)
);

return arr.length?

'<section class="section">'+
'<h2>'+title+'</h2>'+
'<div class="grid">'+
arr.map(x=>card(x,type)).join('')+
'</div>'+
'</section>'

:'';

}

function render(){

setupTabs();

let h=
tab==='inicio'

?
section('Canais em destaque','canais')+
section('Filmes','filmes')+
section('Séries','series')+
section('Livros','livros')+
section('E-books','ebooks')+
section('Audiobooks','audiobooks')

:
section(labels[tab],tab);

content.innerHTML=
h||
'<div class="empty">Nenhum conteúdo encontrado.</div>';

}

function demo(){

alert(
'Este conteúdo está no catálogo de demonstração. A reprodução será ativada posteriormente, por cliente.'
);

}

function esc(x){

return String(x).replace(
/[&<>"]/g,
c=>({
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;'
}[c])
);

}

function sair(){

localStorage.removeItem('mp_user');
sessionStorage.removeItem('mp_user');

location.href='/login.html';

}

if(!user){

location.href='/login.html';

}else{

render();

}

</script>

</body>
</html>
