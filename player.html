<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multiplay - Player</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      min-height: 100vh;
    }

    header {
      height: 60px;
      display: flex;
      align-items: center;
      padding: 0 15px;
      background: #111;
      border-bottom: 1px solid #222;
    }

    .voltar {
      background: #222;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 15px;
      font-size: 15px;
      cursor: pointer;
    }

    .titulo {
      margin-left: 15px;
      font-size: 18px;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    main {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
    }

    .video-container {
      width: 100%;
      background: #000;
      position: relative;
    }

    video {
      width: 100%;
      height: auto;
      min-height: 250px;
      max-height: 75vh;
      display: block;
      background: #000;
    }

    .status {
      padding: 15px;
      text-align: center;
      color: #ccc;
      font-size: 14px;
    }

    .erro {
      display: none;
      padding: 20px;
      text-align: center;
      color: #ff6b6b;
    }
  </style>
</head>

<body>

  <header>
    <button class="voltar" onclick="voltar()">
      ← Voltar
    </button>

    <div class="titulo" id="titulo">
      Multiplay
    </div>
  </header>

  <main>

    <div class="video-container">
      <video
        id="video"
        controls
        autoplay
        playsinline>
      </video>
    </div>

    <div class="status" id="status">
      Carregando transmissão...
    </div>

    <div class="erro" id="erro">
      Não foi possível carregar este canal.
    </div>

  </main>

  <!-- HLS.js -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>

  <!-- JavaScript do player -->
  <script src="player.js"></script>

</body>
</html>
