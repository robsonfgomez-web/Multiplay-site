<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#000000"
  >

  <title>MultiPlay - Player</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
    }

    header {
      height: 60px;
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 15px;
      background: #111;
      border-bottom: 1px solid #222;
    }

    .voltar {
      background: #222;
      color: #fff;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 10px 15px;
      font-size: 15px;
      cursor: pointer;
    }

    .voltar:hover {
      background: #333;
    }

    .titulo {
      flex: 1;
      min-width: 0;
      font-size: 18px;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    main {
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
    }

    .video-container {
      width: 100%;
      background: #000;
      position: relative;
    }

    video {
      width: 100%;
      height: auto;
      min-height: 250px;
      max-height: 78vh;
      display: block;
      background: #000;
    }

    .status {
      min-height: 45px;
      padding: 15px;
      text-align: center;
      color: #aaa;
      font-size: 14px;
    }

    .erro {
      display: none;
      margin: 0 15px 20px;
      padding: 15px;
      text-align: center;
      color: #ff7777;
      background: #210909;
      border: 1px solid #5b1515;
      border-radius: 8px;
      font-size: 15px;
    }

  </style>

</head>


<body>

  <header>

    <button
      class="voltar"
      onclick="goBack()"
    >
      ← Voltar
    </button>

    <div
      class="titulo"
      id="title"
    >
      MultiPlay
    </div>

  </header>


  <main>

    <div class="video-container">

      <video
        id="video"
        controls
        autoplay
        playsinline
        preload="metadata"
      ></video>

    </div>


    <div
      class="status"
      id="status"
    >
      Preparando reprodução...
    </div>


    <div
      class="erro"
      id="error"
    >
      Não foi possível carregar este conteúdo.
    </div>

  </main>


  <script
    src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"
  ></script>


  <script src="/player.js"></script>

</body>

</html>
