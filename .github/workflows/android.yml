name: Multiplay Android Apps
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Build Entretenimento
        working-directory: android
        run: |
          gradle wrapper --gradle-version 8.9
          ./gradlew --no-daemon clean assembleDebug
      - name: Verify Entretenimento APK
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/apksigner verify android/app/build/outputs/apk/debug/app-debug.apk
      - name: Save Entretenimento APK
        uses: actions/upload-artifact@v4
        with:
          name: Multiplay-Entretenimento-2.0.2-Android13
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Build Educação
        working-directory: android-educacao
        run: gradle --no-daemon clean assembleDebug
      - name: Verify Educação APK
        run: |
          test -f android-educacao/app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/apksigner verify android-educacao/app/build/outputs/apk/debug/app-debug.apk
      - name: Save Educação APK
        uses: actions/upload-artifact@v4
        with:
          name: Multiplay-Educacao-TCL-Android13-Teste-1.0.1
          path: android-educacao/app/build/outputs/apk/debug/app-debug.apk
