name: Multiplay Educação Android 1.3.4
on:
  push:
    paths:
      - 'android-educacao/**'
      - '.github/workflows/multiplay-educacao-android.yml'
  workflow_dispatch:
jobs:
  android-educacao:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release
        working-directory: android-educacao
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Sign and package APK
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          keytool -genkeypair -v -keystore /tmp/multiplay-educacao-test.jks -alias multiplay-edu -keyalg RSA -keysize 2048 -validity 10000 -storepass multiplaytest -keypass multiplaytest -dname "CN=Multiplay Educação, OU=Test, O=Multiplay, L=Curitiba, ST=PR, C=BR"
          "$BUILD_TOOLS/zipalign" -f 4 android-educacao/app/build/outputs/apk/release/app-release-unsigned.apk /tmp/multiplay-aligned.apk
          "$BUILD_TOOLS/apksigner" sign --ks /tmp/multiplay-educacao-test.jks --ks-key-alias multiplay-edu --ks-pass pass:multiplaytest --key-pass pass:multiplaytest --out android-educacao/app/build/outputs/apk/release/Multiplay-Educacao-1.3.4.apk /tmp/multiplay-aligned.apk

      - name: Verify APK
        run: |
          set -euo pipefail
          APK="android-educacao/app/build/outputs/apk/release/Multiplay-Educacao-1.3.4.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --verbose "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: Multiplay-Educacao-1.3.4-Android
          path: android-educacao/app/build/outputs/apk/release/Multiplay-Educacao-1.3.4.apk
          if-no-files-found: error
