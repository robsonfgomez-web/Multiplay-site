name: Multiplay Educação Android 1.2.2
on:
  push:
    paths:
      - 'android-educacao/**'
      - '.github/workflows/multiplay-educacao-android.yml'
  workflow_dispatch:
jobs:
  android-educacao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build Multiplay Educação
        working-directory: android-educacao
        run: |
          gradle wrapper --gradle-version 8.9
          ./gradlew --no-daemon assembleDebug
      - name: Verify APK
        run: |
          test -f android-educacao/app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/apksigner verify android-educacao/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Multiplay-Educacao-1.2.2-Android
          path: android-educacao/app/build/outputs/apk/debug/app-debug.apk
