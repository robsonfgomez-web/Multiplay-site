name: Multiplay Admin Android
on:
  push:
    paths:
      - 'android-admin/**'
      - '.github/workflows/multiplay-admin-android.yml'
  workflow_dispatch:
jobs:
  android-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build painel administrativo
        working-directory: android-admin
        run: |
          gradle wrapper --gradle-version 8.9
          ./gradlew --no-daemon assembleDebug
      - name: Verify APK
        run: |
          test -f android-admin/app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/apksigner verify android-admin/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Multiplay-Painel-Admin-1.0.0
          path: android-admin/app/build/outputs/apk/debug/app-debug.apk
